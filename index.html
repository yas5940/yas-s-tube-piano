:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#eaf5f6;background:#0c1b25}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}.app{display:flex;flex-direction:column;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 9px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);gap:9px}header,.controls,.readout{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.02em}header{justify-content:space-between}.pill{font-size:11px;color:#9eced0}.panel{background:#15313f;border:1px solid #315565;border-radius:13px;padding:10px}.readout{justify-content:space-between}.note{font-size:28px;font-weight:800}.muted{font-size:11px;color:#a9c6c9}.controls{gap:7px}button,select{font:inherit;font-size:13px;color:#f1fcfb;background:#224655;border:1px solid #49727f;border-radius:9px;padding:9px 10px;min-height:39px}button.selected{background:#267e80;border-color:#55d6c2}button:active{filter:brightness(1.25)}.keyboard-wrapper{min-height:0;flex:1;display:flex;flex-direction:column}.keyboard-top{display:flex;gap:7px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:7px}.key-viewport{flex:1;min-height:200px;overflow-x:auto;overflow-y:hidden;border-radius:9px;background:#10222a;touch-action:pan-x;scrollbar-color:#558087 transparent}.keys{height:100%;min-height:200px;position:relative;width:100%;user-select:none;-webkit-user-select:none}.white,.black{position:absolute;top:0;touch-action:none;display:flex;align-items:end;justify-content:center;border-radius:0 0 4px 4px;padding-bottom:11px;font-size:10px;cursor:pointer}.white{height:100%;color:#21343b;background:#f8faf9;border:1px solid #7b9a9e}.black{height:61%;z-index:2;background:#17272e;border:1px solid #071118;color:#ecf5f8;font-size:9px}.pressed{background:#60d7c4!important;color:#153d37!important}.hint{font-size:11px;color:#a9c6c9}.landscape-hint{display:none}@media(orientation:landscape){.app{height:100dvh;min-height:0;gap:6px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}.panel{padding:6px 10px}.note{font-size:23px}.keyboard-wrapper{flex:1}.key-viewport,.keys{min-height:90px}.landscape-hint{display:inline}.hint{display:none}header{font-size:13px}button,select{min-height:31px;padding:5px 8px;font-size:12px}.readout .muted{display:inline}.readout{gap:8px}.topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{white-space:nowrap}}@media(max-height:450px) and (orientation:landscape){.app{gap:4px}.panel{padding:4px 7px}.keyboard-top{margin-bottom:4px}.note{font-size:19px}header{display:none}}
</style></head><body><main class="app"><header><div class="brand">🎺 やすのチューバピアノ</div><div class="pill">実音で確認 / 3オクターブ</div></header><section class="panel"><div class="readout"><div><span class="muted">実音 </span><span class="note" id="note">B♭2</span> <span class="muted" id="hz">116.54Hz</span></div><div>移調読み <b id="trans">ド</b></div><div class="controls"><button class="quick" data-m="34">シ♭1</button><button class="quick" data-m="46">シ♭2</button><button id="stop">■ 停止</button></div></div></section><section class="panel"><div class="controls"><label for="range">音域</label><select id="range"><option value="12">C0〜C3 超低音</option><option value="24" selected>C1〜C4 低音</option><option value="36">C2〜C5 標準</option><option value="48">C3〜C6 中音</option></select><button id="fit" class="selected">全鍵表示</button><button id="big">大きい鍵盤</button><button id="brass" class="selected">🎺 チューバ風</button><button id="sine">純音</button><label for="pitch">A4</label><select id="pitch"><option value="440" selected>440Hz</option><option value="442">442Hz</option><option value="441">441Hz</option><option value="438">438Hz</option></select></div></section><section class="keyboard-wrapper panel"><div class="keyboard-top"><strong>🎹 3オクターブ + 最後のド（37鍵）</strong><span class="muted" id="span">C1 → C4</span><span class="hint">📱 横向きで広く表示できます</span><span class="landscape-hint muted">押している間だけ鳴ります</span></div><div class="key-viewport" id="viewport"><div class="keys" id="keys"></div></div></section><div class="hint" id="status" aria-live="polite">押している間だけ音が鳴ります。非常に低い音はイヤホンやスピーカー推奨。</div></main><script>
(()=>{'use strict';const q=id=>document.getElementById(id),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],S=['ド','ド♯','レ','ミ♭','ミ','ファ','ファ♯','ソ','ラ♭','ラ','シ♭','シ'],T=['レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ','ド','ド♯'];let ctx=null,brass=true,wide=false,chosen=46;const voices=new Map(),pending=new Set();const name=m=>N[m%12]+(Math.floor(m/12)-1),frequency=m=>Number(q('pitch').value)*Math.pow(2,(m-69)/12);function show(m){chosen=m;q('note').textContent=name(m);q('hz').textContent=frequency(m).toFixed(2)+'Hz';q('trans').textContent=T[m%12]}
function release(id){pending.delete(id);let v=voices.get(id);if(!v)return;voices.delete(id);v.el.classList.remove('pressed');let t=ctx.currentTime;try{v.g.gain.cancelScheduledValues(t);v.g.gain.setTargetAtTime(0,t,.012);v.o.stop(t+.085)}catch(e){}}
function stop(){pending.clear();[...voices.keys()].forEach(release)}
function press(m,id,el){if(voices.has(id)||pending.has(id))return;pending.add(id);try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio unavailable');if(!ctx)ctx=new AC();const promise=ctx.resume();Promise.resolve(promise).then(()=>{if(!pending.has(id))return;pending.delete(id);const t=ctx.currentTime,g=ctx.createGain(),osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),f=frequency(m);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.06);filter.type='lowpass';filter.frequency.value=brass?Math.max(180,Math.min(1300,f*9)):19000;if(brass)osc.setPeriodicWave(ctx.createPeriodicWave(new Float32Array(9),new Float32Array([0,1,.55,.29,.17,.09,.05,.025,.012])));else osc.type='sine';osc.frequency.value=f;osc.connect(filter);filter.connect(g);g.connect(ctx.destination);osc.start(t);voices.set(id,{o:osc,g,el});el.classList.add('pressed');show(m)}).catch(()=>{pending.delete(id);q('status').textContent='音声再生ができません。音量やブラウザをご確認ください'})}catch(e){pending.delete(id)}}
function bind(el,m){el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}press(m,e.pointerId,el)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,e=>release(e.pointerId)));el.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();press(m,'kb-'+m,el)}});el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')release('kb-'+m)});el.addEventListener('blur',()=>release('kb-'+m))}
function draw(){stop();let base=Number(q('range').value),box=q('keys');box.replaceChildren();box.style.width=wide?'1056px':'100%';for(let j=0;j<22;j++){let semi=[0,2,4,5,7,9,11][j%7],m=base+Math.floor(j/7)*12+semi,k=document.createElement('div');k.className='white';k.style.left=wide?j*48+'px':j*100/22+'%';k.style.width=wide?'48px':100/22+'%';k.textContent=S[m%12];k.tabIndex=0;k.role='button';k.ariaLabel=name(m);bind(k,m);box.appendChild(k)}for(let o=0;o<3;o++)for(let [semi,pos] of [[1,1],[3,2],[6,4],[8,5],[10,6]]){let m=base+o*12+semi,k=document.createElement('div');k.className='black';k.style.left=wide?(o*336+pos*48-14.5)+'px':'calc('+((o*7+pos)*100/22)+'% - 1.3%)';k.style.width=wide?'29px':'2.8%';k.textContent=N[semi];k.tabIndex=0;k.role='button';k.ariaLabel=name(m);bind(k,m);box.appendChild(k)}q('span').textContent=name(base)+' → '+name(base+36);q('fit').classList.toggle('selected',!wide);q('big').classList.toggle('selected',wide);q('viewport').scrollLeft=0}
q('range').addEventListener('change',draw);q('fit').onclick=()=>{wide=false;draw()};q('big').onclick=()=>{wide=true;draw()};q('stop').onclick=stop;q('pitch').onchange=()=>{stop();show(chosen)};q('brass').onclick=()=>{stop();brass=true;q('brass').classList.add('selected');q('sine').classList.remove('selected')};q('sine').onclick=()=>{stop();brass=false;q('sine').classList.add('selected');q('brass').classList.remove('selected')};document.querySelectorAll('.quick').forEach(k=>bind(k,Number(k.dataset.m)));window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});show(chosen);draw();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
